<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HDMI Display Poster 1</title>
<link rel="stylesheet" href="posters.css">
</head>
<body>
<div class="poster p1" role="img" aria-label="HDMI Display 多屏独立输出宣传图">
  <div class="bg-grid"></div>
  <div class="glow g-blue"></div>
  <div class="glow g-cyan"></div>
  <div class="glow g-orange"></div>

  <div class="brand"><b>HDMI DISPLAY</b> <span>· 多屏独立输出</span></div>

  <h1>一台 NAS<br><em>几块屏，就是几台独立电脑</em></h1>
  <p class="sub">每个 HDMI / DP 接口独立输出 · 不是镜像</p>
  <div class="chips">
    <span class="chip hot">视频 / RDP / VNC</span>
    <span class="chip">网页</span>
    <span class="chip">画中画</span>
    <span class="chip">一屏一套键鼠</span>
  </div>

  <svg class="cables" viewBox="0 0 1600 900" preserveAspectRatio="none">
    <defs>
      <linearGradient id="cableGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#22d3ee"/>
        <stop offset="1" stop-color="#2563eb"/>
      </linearGradient>
    </defs>
    <path class="cable" d="M332 758 C392 758 370 718 424 718"/>
    <path class="cable" d="M332 758 C420 758 480 718 710 718"/>
    <path class="cable" d="M332 758 C470 758 570 718 996 718"/>
    <path class="cable" d="M332 758 C520 758 690 718 1282 718"/>
  </svg>

  <div class="monitors">
    <div class="monitor">
      <div class="bezel"><div class="screen scr-movie"></div></div>
      <div class="stand"></div>
      <div class="mlabel">视频 / 直播</div>
    </div>
    <div class="monitor">
      <div class="bezel"><div class="screen scr-win"><div class="wgrid"><i></i><i></i><i></i><i></i></div><div class="task"><i></i><i></i><i></i></div></div></div>
      <div class="stand"></div>
      <div class="mlabel">Windows 11 / RDP</div>
    </div>
    <div class="monitor">
      <div class="bezel"><div class="screen scr-vm"></div></div>
      <div class="stand"></div>
      <div class="mlabel">虚拟机 / VNC</div>
    </div>
    <div class="monitor">
      <div class="bezel"><div class="screen scr-web"><div class="bar"></div><div class="bar s"></div><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>
      <div class="stand"></div>
      <div class="mlabel">网页 / 数字标牌</div>
    </div>
  </div>

  <div class="nas">
    <div class="row"><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span></div>
    <div class="name">NAS</div>
    <div class="leds"><i></i><i></i><i></i></div>
  </div>

  <div class="footer">
    <span>飞牛 fnOS · x86_64 · 无需桌面环境</span>
    <span><b>HDMI Display</b> · 多屏管理面板</span>
  </div>
</div>
</body>
</html>
