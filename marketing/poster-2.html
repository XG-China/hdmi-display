<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HDMI Display Poster 2</title>
<link rel="stylesheet" href="posters.css">
</head>
<body>
<div class="poster p2" role="img" aria-label="一台 NAS 多台轻办公电脑宣传图">
  <div class="paper"></div>
  <div class="brand"><b>HDMI DISPLAY</b> <span>· 多屏独立输出</span></div>

  <h1>一台 NAS<br><em>= 多台轻办公电脑</em></h1>
  <div class="sub">每个视频输出口接一块屏，每块屏配一套键鼠<br>不是镜像，各自运行独立系统</div>

  <div class="stations">
    <div class="station">
      <div class="mon"><div class="c c1"></div></div>
      <div class="mh"><span class="dot"></span><b>Windows 11</b><span>RDP</span></div>
      <div class="periph"><div class="kbd"></div><div class="mouse"></div></div>
    </div>
    <div class="station">
      <div class="mon"><div class="c c2"></div></div>
      <div class="mh"><span class="dot"></span><b>虚拟机 2</b><span>VNC</span></div>
      <div class="periph"><div class="kbd"></div><div class="mouse"></div></div>
    </div>
    <div class="station">
      <div class="mon"><div class="c c3"></div></div>
      <div class="mh"><span class="dot"></span><b>展示 / 标牌</b><span>WEB</span></div>
      <div class="periph"><div class="kbd"></div><div class="mouse"></div></div>
    </div>
  </div>

  <div class="nas2">
    <div class="slots"><i></i><i></i><i></i><i></i></div>
    <div class="tag">1 台 NAS</div>
  </div>

  <div class="flow">1 台 NAS <span>→</span> 按接口扩展 <span>→</span> N 块屏 / N 套键鼠</div>

  <div class="foot">
    <span>轻办公 · 家庭实验室 · 多屏展示</span>
    <span>实际数量取决于视频输出接口与硬件配置</span>
  </div>
</div>
</body>
</html>
